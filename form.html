<a class="sticky-back" href="order.html">← Start</a>
  <img class="logo" src="/ltb-logo.png" alt="LTB">
  <div class="brand">Lettuce, Turnip, The Beet</div>
  <div class="week" id="weekLabel">Place Your Order</div>
  <a href="order.html" style="display:block;text-align:center;color:var(--teal-light);font-size:14px;margin-bottom:16px;text-decoration:none;">← Back to start</a>

  <div id="content"><div class="loading">Loading this week's menu…</div></div>

  <script>
    var WORKER = "https://ltb-proxy.strickland-kevinj.workers.dev";
    // ── Order window (Wed-Sun), the AUTHORITATIVE gate ────────────────────
    // Sun(0) and Wed-Sat(3-6) open, Mon and Tue closed. The other half of the
    // reason this build step exists: this rule was added to three pages
    // separately, one copy was missed, and someone ordered on a Monday.
    // `?preview=1` bypasses it so Kevin can check any page on any day.
    function ordersOpen() {
      if (/[?&]preview=1/.test(window.location.search)) return true;
      var d = new Date().getDay();
      return d === 0 || d >= 3;
    }

    // The week's heads-up banner. Absent or empty renders nothing at all, so
    // publishing an unchecked week clears it and a stale message can never linger.
    // This had to be added to three pages by hand and one copy was missed, which
    // is half the reason the build step exists.
    function noticeHtml(cfg) {
      var t = (cfg && cfg.notice) ? String(cfg.notice).trim() : "";
      if (!t) return "";
      return '<div class="week-notice"><b>Heads up this week</b>' + esc(t) + '</div>';
    }
    var config = null;
    var cart = {}; // key "dishIdx:variantIdx" -> qty
    var spiceSelections = {};  // variantKey -> spice level (0-5; 0 = No spice)
    var pastaSelections = {};  // variantKey -> pasta shape string
    var parmSelections = {};   // variantKey -> true/false (parm block at cost)
    var fixSelections = {};    // variantKey -> true/false (fixings yes/no)
    var fixTexts = {};         // variantKey -> free text of requested fixings

    // ── Cart draft (v9.25) ─────────────────────────────────────────────────
    // Identity already survives a refresh; the cart did not. Someone builds a
    // five-dish order, switches apps for ten seconds, and comes back to
    // nothing. Everything the form knows lives in JS objects, so the whole
    // in-progress order can be saved and restored.
    //
    // The cart is keyed by POSITION (gi_di_vi), so a draft is only valid for
    // the exact menu it was built against: restoring last week's indexes under
    // this week's menu would put the WRONG DISHES in someone's cart, which is
    // far worse than losing the draft. Hence the weekLabel and age checks.
    // ── Offline submit queue ────────────────────────────────────────────
    // The last unprotected inch of order durability. Everything from the
    // worker inward is durable, but a customer on bad signal who taps Submit
    // and gets a thrown fetch loses the order with no trace on either side.
    // Queued orders keep their ORIGINAL clientId, and the worker keys pending
    // orders by clientId, so a retry overwrites itself and can never duplicate.
    var QUEUE_KEY = "ltb-submit-queue";
    var QUEUE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
    function readQueue() {
      try {
        var raw = localStorage.getItem(QUEUE_KEY);
        var q = raw ? JSON.parse(raw) : [];
        return Object.prototype.toString.call(q) === '[object Array]' ? q : [];
      } catch (e) { return []; }
    }
    function writeQueue(q) {
      try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
    }
    function enqueueSubmit(payload) {
      var q = readQueue();
      q.push({ clientId: payload.clientId, payload: payload, queuedAt: Date.now() });
      writeQueue(q);
    }
    function queueBanner(html) {
      var el = document.getElementById('queueBanner');
      if (!el) {
        el = document.createElement('div');
        el.id = 'queueBanner';
        el.style.cssText = 'margin:10px 0;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;';
        var host = document.getElementById('content');
        if (host && host.parentNode) host.parentNode.insertBefore(el, host);
      }
      el.innerHTML = html;
    }
    // Drain oldest-first. A 4xx from the worker is a real rejection, not a
    // network failure, so that entry is dropped rather than retried forever.
    function drainQueue() {
      var q = readQueue();
      if (!q.length) return;
      var now = Date.now();
      var fresh = [], expired = 0;
      for (var i = 0; i < q.length; i++) {
        if ((now - q[i].queuedAt) > QUEUE_MAX_AGE_MS) expired++;
        else fresh.push(q[i]);
      }
      if (expired) {
        writeQueue(fresh);
        queueBanner('<div class="msg error">An order saved on this phone was more than a week old, so it was not sent. Sorry about that. Please reorder if you still want it.</div>');
      }
      if (!fresh.length) { if (!expired) writeQueue([]); return; }
      var entry = fresh[0];
      fetch(WORKER + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry.payload),
      })
        .then(function (r) { return r.json().then(function (res) { return { ok: r.ok, res: res }; }); })
        .then(function (out) {
          if (out.res && out.res.ok) {
            var rest = readQueue().filter(function (e) { return e.clientId !== entry.clientId; });
            writeQueue(rest);
            var d = new Date(entry.queuedAt);
            queueBanner('<div class="msg success">Your order from ' + esc(d.toLocaleDateString()) + ' just sent. You are all set.</div>');
            if (rest.length) setTimeout(drainQueue, 400);
          } else if (out.ok === false && out.res && out.res.error) {
            // The worker understood it and said no. Retrying will not help.
            var rest2 = readQueue().filter(function (e) { return e.clientId !== entry.clientId; });
            writeQueue(rest2);
            queueBanner('<div class="msg error">An order saved on this phone could not be sent: ' + esc(out.res.error) + '</div>');
          }
        })
        .catch(function () { /* still offline; try again next load or online event */ });
    }

    var DRAFT_KEY = "ltb-cart-draft";
    var DRAFT_MAX_AGE_MS = 5 * 24 * 60 * 60 * 1000;
    var draftReady = false; // no saving until the first render has happened
    var draftTimer = null;
    function saveDraftSoon() {
      if (draftTimer) clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 250);
    }
    function saveDraft() {
      if (!draftReady || !config || config.paused) return;
      try {
        var budEl = document.getElementById('omakaseBudget');
        var noteEl = document.getElementById('omakaseNote');
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          savedAt: Date.now(),
          weekLabel: config.weekLabel || '',
          cart: cart,
          spice: spiceSelections,
          pasta: pastaSelections,
          parm: parmSelections,
          fix: fixSelections,
          fixTexts: fixTexts,
          omakase: {
            budget: budEl ? budEl.value : '',
            size: omakaseSize,
            note: noteEl ? noteEl.value : ''
          }
        }));
      } catch (e) { /* private mode: a lost draft is not worth an error */ }
    }
    function clearDraft() {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }
    function readDraft() {
      try {
        var raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        if (!d || !d.savedAt) return null;
        // Stale, or built against a different menu: discard rather than risk
        // restoring positions that now point at other dishes.
        if ((Date.now() - d.savedAt) > DRAFT_MAX_AGE_MS) { clearDraft(); return null; }
        if ((d.weekLabel || '') !== ((config && config.weekLabel) || '')) { clearDraft(); return null; }
        return d;
      } catch (e) { return null; }
    }
    // Restore state BEFORE the first render so quantities and option pickers
    // draw already-filled, then push the omakase values into the DOM after.
    function restoreDraft() {
      if (!config || config.paused) return;
      var d = readDraft();
      if (!d) return;
      cart = d.cart || {};
      spiceSelections = d.spice || {};
      pastaSelections = d.pasta || {};
      parmSelections = d.parm || {};
      fixSelections = d.fix || {};
      fixTexts = d.fixTexts || {};
      if (d.omakase && d.omakase.size) omakaseSize = d.omakase.size;
      return d;
    }
    function applyDraftToDom(d) {
      if (!d || !d.omakase) return;
      var budEl = document.getElementById('omakaseBudget');
      var noteEl = document.getElementById('omakaseNote');
      if (budEl && d.omakase.budget) budEl.value = d.omakase.budget;
      if (noteEl && d.omakase.note) noteEl.value = d.omakase.note;
      if (d.omakase.size) setOmakaseSize(d.omakase.size);
      if (typeof omakaseBudgetInput === 'function') omakaseBudgetInput();
    }

    // Option pickers come from the PUBLISHED dish data (dish.options, declared
    // in the app's registry) — no hardcoded dish-name lists here anymore.
    // pastaAppliesTo: a pasta option hides for variants whose label contains
    // any excludeVariants substring (Polenta replaces pasta; Egg Pappardelle
    // IS the pasta) — so it only attaches to the variants it belongs to.
    function dishOptions(dish) { return (dish && dish.options) || {}; }
    // Picker state (spice/pasta) is keyed by DISH NAME, never by menu position.
    // Position keys (gi_di) silently lost selections when the menu re-rendered
    // in a different order between selecting and submitting (a spotlight or new
    // dish shifting positions moved the key out from under the saved value).
    // Name-based keys are stable across any re-render.
    // Per-VARIANT option keys: "small chickpea at spice 1 + large chicken at
    // spice 2" needs independent state per size row, so keys are dish+variant.
    // Name-based (never position-based) so a menu re-render can't orphan them.
    function variantKey(dish, v) {
      return (String((dish && dish.name) || '') + '__' + String((v && v.label) || '')).replace(/[^a-zA-Z0-9]/g, '_');
    }
    // Split a free-text fixings request into discrete line items:
    // "chips, sour cream and cheese" -> ["chips","sour cream","cheese"].
    // Deterministic on purpose — the form knows what was asked; no guessing.
    function splitRequests(txt) {
      var parts = String(txt || '').split(/,|;|\n|\band\b|&|\+/i);
      var out = [], seen = {};
      for (var i = 0; i < parts.length && out.length < 8; i++) {
        var p = parts[i].trim();
        if (!p) continue;
        var k = p.toLowerCase();
        if (seen[k]) continue;
        seen[k] = 1;
        out.push(p);
      }
      return out;
    }
    function pastaAppliesTo(dish, variantLabel) {
      var p = dishOptions(dish).pasta;
      if (!p) return false;
      var excl = p.excludeVariants || [];
      for (var i = 0; i < excl.length; i++) {
        if (String(variantLabel || '').indexOf(excl[i]) !== -1) return false;
      }
      return true;
    }

    function money(n) { return "$" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, ""); }
    function parseServings(label) {
      var m = label.match(/~(\d+)-(\d+)/);
      if (m) return (parseInt(m[1]) + parseInt(m[2])) / 2;
      m = label.match(/~(\d+)/);
      if (m) return parseInt(m[1]);
      return null;
    }
    function fmtLabel(label) {
      if (/~\d/.test(label) && !/serving/.test(label)) {
        return label.replace(/(~[\d]+-?[\d]*)/, '$1 servings');
      }
      return label;
    }
    function perServing(price, label) {
      var s = parseServings(label);
      if (!s || s <= 0) return '';
      var pp = price / s;
      return '~$' + pp.toFixed(2).replace(/\.00$/, '') + '/serving';
    }

    function loadConfig() {
      fetch(WORKER + "/config")
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          config = cfg;
          var draft = restoreDraft();
          render();
          applyDraftToDom(draft);
          draftReady = true;
          drainQueue();
        })
        .catch(function () {
          document.getElementById("content").innerHTML =
            '<div class="msg error">Could not load the menu. Please try again in a moment, or reach out directly.</div>';
        });
    }

    function allGroups() {
      var groups = [];
      if (config.dishes && config.dishes.length) groups.push({ title: "This Week's Dinners", items: config.dishes });
      if (config.spotlight && config.spotlight.length) groups.push({ title: "Spotlight Dinner of the Week", items: config.spotlight });
      if (config.bag && config.bag.length) groups.push({ title: "Ready to Finish", items: config.bag });
      if (config.sauces && config.sauces.length) groups.push({ title: "Finishing Sauces", items: config.sauces });
      if (config.fruit && config.fruit.length) groups.push({ title: "Fresh Cut Fruit", items: config.fruit });
      if (config.desserts && config.desserts.length) groups.push({ title: "Desserts", items: config.desserts });
      if (config.addons && config.addons.length) groups.push({ title: "Add-Ons & Extras", items: config.addons });
      return groups;
    }

    function render() {
      if (config.weekLabel) document.getElementById("weekLabel").textContent = config.weekLabel;

      // Week off: nothing to order, and the form should say so plainly
      // rather than looking broken or empty.
      if (config.paused) {
        document.getElementById("content").innerHTML =
          noticeHtml(config) +
          '<div class="section" style="text-align:center;">' +
          pausedHtml(config) + '</div>';
        return;
      }

      // Closed window: say so plainly and show NO form. The notice still
      // renders above it, since a heads-up matters just as much on a day
      // nobody can order.
      if (!ordersOpen()) {
        document.getElementById("content").innerHTML =
          noticeHtml(config) +
          '<div class="section" style="text-align:center;">' +
          '<div class="section-title">Orders are closed right now</div>' +
          '<div style="font-size:13px;color:var(--dim);line-height:1.6;">' +
          'Orders are open <strong style="color:var(--gold)">Wednesday through Sunday</strong> for delivery the following Wednesday.' +
          '<br><br>Need something outside that window? Just reach out directly and we will work it out.</div></div>';

      for (var i = 0; i < DINNER_BLOCKS.length; i++) {
        var b = DINNER_BLOCKS[i], el = document.getElementById(b.id);
        if (!el) continue;
        var show = !ACTIVE_DIET || dietMatch(b.dish, ACTIVE_DIET) !== 'none' || dishHasCart(b.gi, b.di);
        el.style.display = show ? '' : 'none';
      }
    }
    function setDiet(diet){
      ACTIVE_DIET = (ACTIVE_DIET === diet) ? null : diet;
      var wrap = document.getElementById('dietChips');
      if (wrap) wrap.innerHTML = dietChipsInner();
      applyDietFilter();
    }
    var omakaseSize = 'Small';
    function setOmakaseSize(sz) {
      omakaseSize = sz;
      saveDraftSoon();
      var sEl = document.getElementById('omSizeSmall'), lEl = document.getElementById('omSizeLarge');
      if (sEl) sEl.className = 'om-size' + (sz === 'Small' ? ' om-size-on' : '');
      if (lEl) lEl.className = 'om-size' + (sz === 'Large' ? ' om-size-on' : '');
    }
    function clearOmakaseErr() { var e = document.getElementById('omakaseErr'); if (e) e.innerHTML = ''; }
    // Never advertised. Only appears once a budget clears $300, and only to
    // ask for a hint about which way Kevin should spend it.
    window.addEventListener('online', function () { drainQueue(); });

    function omakaseBudgetInput() {
      clearOmakaseErr();
      saveDraftSoon();
      var b = document.getElementById('omakaseBudget'), n = document.getElementById('omakaseBigNote');
      if (!b || !n) return;
      if (parseFloat(b.value) > 300) {
        n.innerHTML = '<div style="margin:2px 0 10px;padding:9px 11px;border:1px solid var(--gold);border-radius:8px;background:rgba(212,160,80,0.08);font-size:12.5px;color:var(--cream);line-height:1.5;">A budget this size is my cue to either make you several dishes or go after very nice ingredients, prime filet mignon territory, on fewer of them. Both are good nights. If you have a preference, drop a word in the notes below and I will lean that way.</div>';
      } else {
        n.innerHTML = '';
      }
    }
    function omakaseBudgetInvalid() {
      var b = document.getElementById('omakaseBudget');
      return !!(b && b.value.trim() !== '' && !(parseFloat(b.value) >= 50));
    }
    function gatherOmakase() {
      var budEl = document.getElementById('omakaseBudget');
      if (!budEl) return null;
      var bud = parseFloat(budEl.value);
      if (!(bud >= 50)) return null;
      var note = (document.getElementById('omakaseNote').value || '').trim();
      return { name: 'Omakase', variant: omakaseSize, price: bud, cost: 0, qty: 1, note: note, omakase: true, budgetMax: bud };
    }
    function gatherItems() {
      var items = [];
      var groups = allGroups();
      Object.keys(cart).forEach(function (key) {
        var parts = key.split("_");
        var gi = +parts[0], di = +parts[1], vi = +parts[2];
        var group = groups[gi];
        if (!group) return;
        var dish = group.items[di];
        if (!dish) return;
        var v = (dish.variants || [])[vi];
        if (!v) return;
        var vk2 = variantKey(dish, v); // per-variant: each size row keeps its own options
        var opts2 = dishOptions(dish);
        var itemOptions = {};
        var noteparts = []; // note mirror — human-readable copy of every choice
        if (opts2.spice && spiceSelections[vk2] != null) {
          itemOptions.spice = spiceSelections[vk2];
          noteparts.push("Spice: " + spiceSelections[vk2]);
        }
        if (opts2.pasta && pastaSelections[vk2] && pastaAppliesTo(dish, v.label)) {
          itemOptions.pasta = pastaSelections[vk2];
          noteparts.push("Pasta: " + pastaSelections[vk2]);
        }
        // At-cost add-on requests: structured line items, priced by Kevin
        // after shopping (the app renders each as its own pending sub-charge).
        var addons = [];
        if (opts2.parmOffer && parmSelections[vk2] === true) {
          addons.push({ request: "Block of good parm" });
        }
        if (opts2.fixings && fixSelections[vk2] === true) {
          splitRequests(fixTexts[vk2]).forEach(function (r) { addons.push({ request: r }); });
        }
        if (addons.length) {
          noteparts.push("Add-ons at cost: " + addons.map(function (a) { return a.request; }).join("; "));
        }
        var item = { name: dish.name, variant: v.label, price: v.price, cost: v.cost || 0, qty: cart[key], note: noteparts.join(". "), perLb: !!dish.perLb, avgWeightLb: dish.avgWeightLb };
        if (itemOptions.spice != null || itemOptions.pasta) item.options = itemOptions;
        // Only sent when the customer actually had the choice AND took the
        // non-default. An item with no packShape means Family, which is what
        // every order has always been.
        if (v.packs && packSelections[vk2] === 'twoNight') item.packShape = 'twoNight';
        if (addons.length) item.addons = addons;
        items.push(item);
      });
      var _om = gatherOmakase();
      if (_om) items.push(_om);
      return items;
    }

    function openReview() {
      var items = gatherItems();
      var name = (document.getElementById("custName").value || "").trim();
      var address = (document.getElementById("custAddress").value || "").trim();
      var phone = (document.getElementById("custPhone").value || "").trim();
      var notes = (document.getElementById("custNotes").value || "").trim();
      var msgArea = document.getElementById("msgArea");

      if (!name) {
        msgArea.innerHTML = '<div class="msg error">Please enter your name before reviewing.</div>';
        return;
      }
      if (omakaseBudgetInvalid()) {
        msgArea.innerHTML = '<div class="msg error">Omakase minimum is $50 (or leave the budget blank).</div>';
        return;
      }
      if (items.length === 0) {
        msgArea.innerHTML = '<div class="msg error">Please add at least one item to your order.</div>';
        return;
      }
      msgArea.innerHTML = "";

      // Build summary HTML
      var total = 0;
      var hasPerLb = false;
      var summaryHtml = '<div style="margin-bottom:14px;">';
      summaryHtml += '<div style="font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Items</div>';
      items.forEach(function(it) {
        var isPerLb = !!it.perLb;
        var lineTotal;
        var variantLabel;
        if (isPerLb) {
          hasPerLb = true;
          var avgW = it.avgWeightLb || 0;
          lineTotal = (it.price * avgW + 2.00) * it.qty;
          variantLabel = it.qty + ' piece' + (it.qty === 1 ? '' : 's') + ' &middot; priced by weight';
        } else if (it.omakase) {
          lineTotal = it.price * it.qty;
          variantLabel = esc(it.variant) + ' &middot; chef\'s choice';
        } else {
          lineTotal = it.price * it.qty;
          variantLabel = esc(it.variant);
        }
        total += lineTotal;
        var lineTotalStr = (lineTotal % 1 === 0 ? lineTotal : lineTotal.toFixed(2));
        summaryHtml += '<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--cream);padding:4px 0;border-bottom:1px solid #2d3a36;">' +
          '<div>' + esc(it.qty) + '× ' + esc(it.name) + '<br><span style="font-size:12px;color:var(--dim);">' + variantLabel + ((it.note && !it.omakase) ? ' \u2014 ' + esc(it.note) : '') + '</span></div>' +
          '<div style="font-weight:700;color:var(--gold);white-space:nowrap;padding-left:12px;">' + (isPerLb ? '~' : '') + '$' + lineTotalStr + (it.omakase ? ' max' : '') + '</div>' +
          '</div>' +
          ((it.omakase && it.note) ? '<div style="margin:6px 0 10px;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:rgba(212,160,80,0.08);">' +
            '<div style="font-size:10.5px;color:var(--gold);font-weight:700;letter-spacing:0.5px;margin-bottom:3px;">YOUR NOTE TO THE CHEF</div>' +
            '<div style="font-size:13px;color:var(--cream);line-height:1.5;">' + esc(it.note) + '</div></div>' : '');
      });
      var totalStr = (total % 1 === 0 ? total : total.toFixed(2));
      // M4: container space, Kevin's exact thresholds — 4+ Large portions or
      // 8+ Smalls, and BELOW that nobody needs warning, so below that this
      // block renders nothing at all. A friendly heads-up, never a blocker:
      // the submit button is untouched. Per-lb cuts are vacuum bags, not
      // containers, so they never count toward either threshold.
      var largeCount = 0, smallCount = 0;
      items.forEach(function (it) {
        if (it.perLb) return;
        var v = it.variant || "";
        if (/large/i.test(v)) largeCount += it.qty;
        else if (/small/i.test(v)) smallCount += it.qty;
      });
      if (largeCount >= 4 || smallCount >= 8) {
        summaryHtml += '<div class="container-space-note" style="margin:10px 0 4px;padding:9px 11px;border:1px solid var(--gold);border-radius:8px;background:rgba(212,160,80,0.08);font-size:12.5px;color:var(--cream);line-height:1.5;">' +
          '<span style="color:var(--gold);font-weight:700;">A note on fridge space:</span> that\u2019s ' +
          (largeCount >= 4 ? largeCount + ' large containers' : smallCount + ' containers') +
          ' arriving Wednesday \u2014 worth clearing a shelf before delivery day.</div>';
      }
      summaryHtml += '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--gold);padding:10px 0 4px;">' +
        '<span>Total' + (hasPerLb ? ' (est.)' : '') + '</span><span>' + (hasPerLb ? '~' : '') + '$' + totalStr + '</span></div>';
      if (hasPerLb) {
        summaryHtml += '<div style="font-size:11px;color:var(--dim);font-style:italic;padding-top:2px;">Items priced by weight are estimated at typical piece sizes. Final price settles at the actual weight of your cuts.</div>';
      }
      summaryHtml += '</div>';

      summaryHtml += '<div style="font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Your Details</div>';
      summaryHtml += '<div style="font-size:14px;color:var(--cream);line-height:1.7;">';
      summaryHtml += '<strong>Name:</strong> ' + esc(name) + '<br>';
      if (address) summaryHtml += '<strong>Address:</strong> ' + esc(address) + '<br>';
      if (phone) summaryHtml += '<strong>Phone:</strong> ' + esc(phone) + '<br>';
      if (notes) summaryHtml += '<strong>Notes:</strong> ' + esc(notes) + '<br>';
      summaryHtml += '</div>';

      document.getElementById("reviewSummary").innerHTML = summaryHtml;
      document.getElementById("reviewModal").style.display = "block";
      document.body.style.overflow = "hidden";
    }

    function closeReview() {
      document.getElementById("reviewModal").style.display = "none";
      document.body.style.overflow = "";
    }

    // ── Idempotency (v9.23) ────────────────────────────────────────────────
    // The button disables on submit, which only stops a FAST double-tap. The
    // case that actually duplicates an order is the slow one: the request is
    // in flight, fetch times out, .catch re-enables the button, the customer
    // taps again — and the first request landed after all. Two orders, one
    // customer, both real as far as the books are concerned.
    //
    // So the key must survive the retry. Generated ONCE per order attempt and
    // reused for every retry of that same order; the worker uses it as the KV
    // key, so a retry overwrites itself instead of queueing twice. Cleared
    // only on success, when the next order legitimately becomes a new order.
    //
    // Must match the worker's /^[A-Za-z0-9_-]{8,64}$/ exactly. A key that
    // fails that regex is silently ignored and the worker generates its own
    // id — which would look like this worked while deduping nothing.
    // ES5 only, and no crypto.randomUUID: this page loads on whatever phone
    // a friend happens to own, and randomUUID needs a secure context.
    var pendingClientId = null;
    function orderAttemptId() {
      if (pendingClientId) return pendingClientId;
      var s = "";
      while (s.length < 24) {
        s += Math.random().toString(36).slice(2);
      }
      pendingClientId = ("c" + Date.now().toString(36) + s).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
      return pendingClientId;
    }

    function submitOrder() {
      var name = (document.getElementById("custName").value || "").trim();
      var address = (document.getElementById("custAddress").value || "").trim();
      var phone = (document.getElementById("custPhone").value || "").trim();
      var notes = (document.getElementById("custNotes").value || "").trim();
      var items = gatherItems();
      var msgArea = document.getElementById("msgArea");

      if (!name) {
        msgArea.innerHTML = '<div class="msg error">Please enter your name.</div>';
        return;
      }
      if (omakaseBudgetInvalid()) {
        msgArea.innerHTML = '<div class="msg error">Omakase minimum is $50 (or leave the budget blank).</div>';
        return;
      }
      if (items.length === 0) {
        msgArea.innerHTML = '<div class="msg error">Please add at least one item to your order.</div>';
        return;
      }

      var btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.textContent = "Submitting…";

      // carlMode is sent as a BOOLEAN and nothing more. The swaps are derived
      // from src/carl.js when Kevin's order card renders, so a ruling change
      // updates every existing order instead of leaving stale substitutions
      // frozen into the ones already placed.
      // noteScope rides ALONGSIDE the note and never modifies it. '' means the
      // question was never asked or never answered, which is the same as today.
      var __scope = (typeof __ltbNoteScope === 'function') ? __ltbNoteScope() : '';
      var submitPayload = { customer: name, address: address, phone: phone, items: items, notes: notes, noteScope: __scope, clientId: orderAttemptId(), carlMode: (typeof __carlOn !== 'undefined' && __carlOn) === true };

      // Device enrollment rides the order. Minted here rather than on page load
      // so a browser that only ever reads the menu never gets one — nobody who
      // has not ordered should be carrying a credential.
      //
      // It goes into the payload BEFORE enqueueSubmit can store it, which is
      // what makes an offline retry safe: the queued entry replays this exact
      // token instead of minting a fresh one and enrolling the same person
      // twice under two profiles.
      if (typeof __ltbDeviceToken === 'function') {
        var __dev = __ltbDeviceToken();
        if (__dev) submitPayload.deviceToken = __dev;
      }

      fetch(WORKER + "/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(submitPayload),
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) {
            // Success: this order is done. The next one is a new order and
            // must get its own key, or it would overwrite this one.
            pendingClientId = null;
            // Persist identity (name/address/phone) for next week's prefill.
            saveIdentity(name, address, phone);
            recordOrderPlaced();
            clearDraft();
            document.getElementById("content").innerHTML =
              '<div class="msg success">Thanks, ' + esc(name) + '! Your order is in.<br>' +
              'You will get a confirmation directly once it is reviewed.</div>' +
              '<div class="section"><div class="section-title">Your order</div>' +
              buildReceiptHtml(items) +
              '<div style="font-size:12px;color:var(--dim);font-style:italic;text-align:center;margin-top:2px;">Screenshot this if you want a record.</div>' +
              '</div>' +
              '<a href="order.html" style="display:block;text-align:center;margin-top:16px;padding:12px 20px;background:var(--teal-mid);color:var(--cream);font-weight:700;font-size:14px;border-radius:10px;text-decoration:none;">← Back to start</a>';
            window.scrollTo(0, 0);
          } else {
            msgArea.innerHTML = '<div class="msg error">' + esc(res.error || "Something went wrong.") + ' Please try again.</div>';
            btn.disabled = false; btn.textContent = "Submit Order";
          }
        })
        .catch(function () {
          // Network failure, not a rejection. Keep the order on the phone and
          // tell the truth: it is saved and will send itself.
          enqueueSubmit(submitPayload);
          pendingClientId = null;
          saveIdentity(name, address, phone);
          recordOrderPlaced();
          clearDraft();
          document.getElementById("content").innerHTML =
            '<div class="msg success">Thanks, ' + esc(name) + '! Your order is saved on this phone.<br>' +
            'Your signal dropped, so it has not reached me yet. It will send automatically the next time you have service, and you do not need to do anything.</div>' +
            '<div class="section"><div class="section-title">Your order</div>' +
            buildReceiptHtml(items) +
            '<div style="font-size:12px;color:var(--dim);font-style:italic;text-align:center;margin-top:2px;">Screenshot this if you want a record.</div>' +
            '</div>' +
            '<a href="order.html" style="display:block;text-align:center;margin-top:16px;padding:12px 20px;background:var(--teal-mid);color:var(--cream);font-weight:700;font-size:14px;border-radius:10px;text-decoration:none;">← Back to start</a>';
          window.scrollTo(0, 0);
        });
    }

    // ── Identity memory (v9.24) ────────────────────────────────────────────
    // Regulars re-type the same name, address, and phone every single week.
    // Those three fields never change, so persist them on a successful submit
    // and prefill on the next visit. Identity only: never the cart, never the
    // notes, nothing menu-dependent. One "Not you?" link clears it. ES5 only,
    // and wrapped in try/catch because localStorage throws in private mode on
    // some phones.
    var IDENTITY_KEY = "ltb-order-identity";
    // Proof-of-order, written on every successful submit. pipeline.html reads
    // it (same origin) to weight a regular's vote. Deliberately not a login:
    // this is a friends-only shop and the stakes of a miscounted vote are a
    // dish running a week later than it might have.
    var ORDER_HISTORY_KEY = "ltb-order-history";
    function recordOrderPlaced() {
      try {
        var raw = localStorage.getItem(ORDER_HISTORY_KEY);
        var h = raw ? JSON.parse(raw) : { count: 0, first: null, last: null };
        h.count = (h.count || 0) + 1;
        h.first = h.first || new Date().toISOString();
        h.last = new Date().toISOString();
        localStorage.setItem(ORDER_HISTORY_KEY, JSON.stringify(h));
      } catch (e) {}
    }
    function loadIdentity() {
      try {
        var raw = localStorage.getItem(IDENTITY_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    function saveIdentity(name, address, phone) {
      try {
        localStorage.setItem(IDENTITY_KEY, JSON.stringify({ name: name, address: address, phone: phone }));
      } catch (e) {}
    }
    function clearIdentity() {
      try { localStorage.removeItem(IDENTITY_KEY); } catch (e) {}
      var n = document.getElementById("custName"); if (n) { n.value = ""; }
      var a = document.getElementById("custAddress"); if (a) { a.value = ""; }
      var p = document.getElementById("custPhone"); if (p) { p.value = ""; }
      var row = document.getElementById("notYouRow"); if (row) { row.style.display = "none"; }
      if (n) { n.focus(); }
    }
    function prefillIdentity() {
      var id = loadIdentity();
      if (!id) return;
      var n = document.getElementById("custName");
      var a = document.getElementById("custAddress");
      var p = document.getElementById("custPhone");
      if (n && !n.value && id.name) n.value = id.name;
      if (a && !a.value && id.address) a.value = id.address;
      if (p && !p.value && id.phone) p.value = id.phone;
      var row = document.getElementById("notYouRow");
      if (row && id.name) {
        row.innerHTML = 'Saved as <b>' + esc(id.name) + '</b>. ' +
          '<a href="#" onclick="clearIdentity();return false;" style="color:var(--teal-light);">Not you?</a>';
        row.style.display = "block";
      }
    }

    // ── Success receipt ────────────────────────────────────────────────────
    // Renders what the customer just ordered, with the estimated total, on the
    // success screen so they can screenshot a record instead of texting to ask
    // what they picked. Mirrors the review modal's item + total math (per-lb
    // aware); kept as its own function so the working review path is untouched.
    function buildReceiptHtml(items) {
      var total = 0, hasPerLb = false, rows = "";
      items.forEach(function (it) {
        var isPerLb = !!it.perLb, lineTotal, variantLabel;
        if (isPerLb) {
          hasPerLb = true;
          var avgW = it.avgWeightLb || 0;
          lineTotal = (it.price * avgW + 2.00) * it.qty;
          variantLabel = it.qty + ' piece' + (it.qty === 1 ? '' : 's') + ' &middot; priced by weight';
        } else if (it.omakase) {
          lineTotal = it.price * it.qty;
          variantLabel = esc(it.variant) + ' &middot; chef\'s choice';
        } else {
          lineTotal = it.price * it.qty;
          variantLabel = esc(it.variant);
        }
        total += lineTotal;
        var lineTotalStr = (lineTotal % 1 === 0 ? lineTotal : lineTotal.toFixed(2));
        rows += '<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--cream);padding:4px 0;border-bottom:1px solid #2d3a36;">' +
          '<div>' + esc(it.qty) + '× ' + esc(it.name) + '<br><span style="font-size:12px;color:var(--dim);">' + variantLabel + '</span></div>' +
          '<div style="font-weight:700;color:var(--gold);white-space:nowrap;padding-left:12px;">' + (isPerLb ? '~' : '') + '$' + lineTotalStr + (it.omakase ? ' max' : '') + '</div>' +
          '</div>' +
          ((it.omakase && it.note) ? '<div style="margin:6px 0 10px;padding:8px 10px;border:1px solid var(--gold);border-radius:8px;background:rgba(212,160,80,0.08);">' +
            '<div style="font-size:10.5px;color:var(--gold);font-weight:700;letter-spacing:0.5px;margin-bottom:3px;">YOUR NOTE TO THE CHEF</div>' +
            '<div style="font-size:13px;color:var(--cream);line-height:1.5;">' + esc(it.note) + '</div></div>' : '');
      });
      var totalStr = (total % 1 === 0 ? total : total.toFixed(2));
      var html = '<div style="text-align:left;margin:14px 0 6px;">' + rows +
        '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--gold);padding:10px 0 4px;">' +
        '<span>Total' + (hasPerLb ? ' (est.)' : '') + '</span><span>' + (hasPerLb ? '~' : '') + '$' + totalStr + '</span></div>';
      if (hasPerLb) {
        html += '<div style="font-size:11px;color:var(--dim);font-style:italic;padding-top:2px;">Items priced by weight settle at the actual weight of your cuts.</div>';
      }
      html += '</div>';
      return html;
    }

    loadConfig();
  </script>
